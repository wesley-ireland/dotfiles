# Enable copy and paste
map ctrl+c copy_and_clear_or_interrupt
map ctrl+v paste_from_clipboard

# Use ZSH
shell /usr/bin/zsh

# Increase font size
font_size 16.0

# Background opacity
background_opacity 0.75

# Note: The below block can be edited using `kitten choose-fonts` GUI.
# BEGIN_KITTY_FONTS
font_family      family='Adwaita Mono' postscript_name=Adwaita-Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
